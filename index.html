<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEIS 중식 급식 조회 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-200">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">오늘의 학교 급식</h1>
                    <p class="text-xs text-slate-500">전국 학교 중식 식단 및 영양 정보 조회</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="env-badge" class="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-full border border-emerald-200 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Vercel API 연동됨
                </span>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- 검색 카드 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 md:p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass text-blue-600"></i> 급식 검색 조건
                </h2>
                <div class="text-xs text-slate-400">
                    학교 코드: <span id="display-school-code" class="font-mono font-medium text-slate-600">7010569</span> | 
                    교육청: <span id="display-edu-code" class="font-mono font-medium text-slate-600">J10</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <!-- 학교 선택 영역 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">조회 학교</label>
                    <div class="flex gap-2">
                        <div id="selected-school-name" class="flex-grow px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 flex items-center justify-between">
                            <span>수성고등학교 (경기)</span>
                            <i class="fa-solid fa-check text-blue-600 text-xs"></i>
                        </div>
                        <button onclick="openSchoolModal()" type="button" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-xl transition shadow-sm shrink-0 flex items-center gap-1.5">
                            <i class="fa-solid fa-school"></i> 학교 변경
                        </button>
                    </div>
                </div>

                <!-- 날짜 선택 영역 -->
                <div>
                    <label for="meal-date" class="block text-xs font-semibold text-slate-600 mb-1.5">급식 일자 (MLSV_YMD)</label>
                    <div class="relative">
                        <input type="date" id="meal-date" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition">
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">오늘 날짜 자동 입력 (달력으로 변경 가능)</p>
                </div>
            </div>

            <!-- 하단 빠른 즐겨찾기 학교 및 검색 버튼 -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between pt-4 border-t border-slate-100 gap-3">
                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-xs font-medium text-slate-500 mr-1">빠른 선택:</span>
                    <button onclick="quickSelectSchool('J10', '7010569', '수성고등학교', '경기')" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 text-xs font-medium rounded-lg transition">수성고</button>
                    <button onclick="quickSelectSchool('B10', '7010107', '서울고등학교', '서울')" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 text-xs font-medium rounded-lg transition">서울고</button>
                    <button onclick="quickSelectSchool('C10', '7150162', '수원고등학교', '부산/기타')" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-slate-600 text-xs font-medium rounded-lg transition">부산과학고</button>
                </div>

                <button onclick="fetchMealData()" id="search-btn" class="w-full sm:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl text-sm transition shadow-md shadow-blue-500/20 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-utensils"></i> 중식 급식 조회하기
                </button>
            </div>
        </div>

        <!-- 로딩 상태 표시 -->
        <div id="loading-state" class="hidden py-16 text-center">
            <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-sm font-medium text-slate-600">NEIS 급식 정보를 불러오는 중입니다...</p>
        </div>

        <!-- 결과 출력 영역 -->
        <div id="result-container" class="space-y-6">
            <!-- 초기 안내 또는 데이터 결과가 여기에 동적으로 렌더링됨 -->
            <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center text-slate-400">
                <i class="fa-solid fa-plate-wheat text-4xl mb-3 text-slate-300"></i>
                <p class="text-sm font-medium text-slate-600">조회 버튼을 눌러 중식 식단표를 확인하세요.</p>
                <p class="text-xs text-slate-400 mt-1">주말이나 공휴일은 급식 정보가 없을 수 있습니다.</p>
            </div>
        </div>

    </main>

    <!-- 학교 검색 모달 -->
    <div id="school-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-school text-blue-600"></i> 학교 검색
                </h3>
                <button onclick="closeSchoolModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="flex gap-2 mb-4">
                    <input type="text" id="school-search-input" placeholder="학교 이름을 입력하세요 (예: 수성고, 서울고)" class="flex-grow px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600" onkeydown="if(event.key === 'Enter') searchSchools()">
                    <button onclick="searchSchools()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl transition shrink-0">검색</button>
                </div>
                
                <!-- 검색 결과 리스트 -->
                <div id="school-search-results" class="max-h-64 overflow-y-auto space-y-2 border border-slate-100 rounded-xl p-2 bg-slate-50/50">
                    <div class="text-center py-8 text-xs text-slate-400">
                        찾으실 학교명을 입력하고 검색 버튼을 누르세요.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-12 text-center text-xs text-slate-400">
        <p>Data provided by <a href="https://open.neis.go.kr" target="_blank" class="underline hover:text-blue-600">NEIS 교육행정정보시스템 오픈API</a></p>
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        // Vercel 환경 변수에서 API 키를 주입받거나, 없으면 기본 공개 샘플 키 사용
        // Vercel 배포 시 빌드 타임 혹은 서버 렌더링 과정에서 process.env.NEIS_API_KEY가 치환됨
        const NEIS_API_KEY = "__NEIS_API_KEY__" !== "__NEIS_API_KEY__" ? "__NEIS_API_KEY__" : "sample";

        // 상태값 관리
        let currentEduCode = 'J10'; // 경기도교육청 기본
        let currentSchoolCode = '7010569'; // 수성고등학교 기본
        let currentSchoolName = '수성고등학교';
        let currentRegionName = '경기';

        // 페이지 로드 시 오늘 날짜 자동 세팅 및 데이터 조회
        window.addEventListener('DOMContentLoaded', () => {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('meal-date').value = todayStr;
            
            // 개발용 환경 키 안내 표시 업데이트
            if (NEIS_API_KEY === 'sample') {
                document.getElementById('env-badge').innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> 샘플 API 모드`;
                document.getElementById('env-badge').className = "px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-semibold rounded-full border border-amber-200 flex items-center gap-1";
            }

            // 최초 자동 조회 실행
            fetchMealData();
        });

        // 빠른 학교 선택
        function quickSelectSchool(eduCode, schoolCode, schoolName, region) {
            currentEduCode = eduCode;
            currentSchoolCode = schoolCode;
            currentSchoolName = schoolName;
            currentRegionName = region;

            document.getElementById('display-edu-code').innerText = eduCode;
            document.getElementById('display-school-code').innerText = schoolCode;
            document.getElementById('selected-school-name').innerHTML = `<span>${schoolName} (${region})</span><i class="fa-solid fa-check text-blue-600 text-xs"></i>`;
            
            fetchMealData();
        }

        // 학교 검색 모달 열기/닫기
        function openSchoolModal() {
            document.getElementById('school-modal').classList.remove('hidden');
            document.getElementById('school-search-input').focus();
        }
        function closeSchoolModal() {
            document.getElementById('school-modal').classList.add('hidden');
        }

        // NEIS 학교 기본정보 API 호출 (학교 검색)
        async function searchSchools() {
            const query = document.getElementById('school-search-input').value.trim();
            const resultsContainer = document.getElementById('school-search-results');
            
            if (!query) {
                alert('학교 이름을 입력해주세요.');
                return;
            }

            resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-400"><i class="fa-solid fa-spinner animate-spin mr-1"></i> 검색 중...</div>`;

            const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_API_KEY}&Type=json&pIndex=1&pSize=20&SCHUL_NM=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.RESULT && data.RESULT.CODE) {
                    if (data.RESULT.CODE === 'INFO-200') {
                        resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-rose-500">검색 결과가 없습니다.</div>`;
                        return;
                    }
                    if (data.RESULT.CODE === 'INFO-300' || data.RESULT.CODE.startsWith('ERROR')) {
                        resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-rose-500">인증키 오류 또는 API 호출 제한 (${data.RESULT.MESSAGE})</div>`;
                        return;
                    }
                }

                const schoolRows = data.schoolInfo && data.schoolInfo[1] ? data.schoolInfo[1].row : [];
                
                if (schoolRows.length === 0) {
                    resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">검색된 학교가 없습니다.</div>`;
                    return;
                }

                let html = '';
                schoolRows.forEach(school => {
                    html += `
                        <div onclick="selectSchoolFromSearch('${school.ATPT_OFCDC_SC_CODE}', '${school.SD_SCHUL_CODE}', '${school.SCHUL_NM}', '${school.LCTN_SC_NM}')" 
                             class="p-3 bg-white hover:bg-blue-50 border border-slate-100 rounded-xl cursor-pointer transition flex items-center justify-between group">
                            <div>
                                <div class="text-sm font-bold text-slate-800 group-hover:text-blue-600">${school.SCHUL_NM}</div>
                                <div class="text-xs text-slate-400">${school.ORG_RDNMA || school.LCTN_SC_NM || ''} (${school.HS_SC_NM || school.SCHUL_KND_SC_NM})</div>
                            </div>
                            <span class="text-xs px-2.5 py-1 bg-slate-100 group-hover:bg-blue-600 group-hover:text-white rounded-lg font-medium transition">선택</span>
                        </div>
                    `;
                });
                resultsContainer.innerHTML = html;

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-rose-500">학교 검색 중 오류가 발생했습니다.</div>`;
            }
        }

        // 검색된 학교 중 하나 선택
        function selectSchoolFromSearch(eduCode, schoolCode, schoolName, region) {
            currentEduCode = eduCode;
            currentSchoolCode = schoolCode;
            currentSchoolName = schoolName;
            currentRegionName = region;

            document.getElementById('display-edu-code').innerText = eduCode;
            document.getElementById('display-school-code').innerText = schoolCode;
            document.getElementById('selected-school-name').innerHTML = `<span>${schoolName} (${region})</span><i class="fa-solid fa-check text-blue-600 text-xs"></i>`;
            
            closeSchoolModal();
            fetchMealData();
        }

        // 중식 급식 정보 조회
        async function fetchMealData() {
            const dateInput = document.getElementById('meal-date').value;
            const mlsvYmd = dateInput.replace(/-/g, ''); // YYYYMMDD 형식으로 변환

            const loadingEl = document.getElementById('loading-state');
            const containerEl = document.getElementById('result-container');

            loadingEl.classList.remove('hidden');
            containerEl.innerHTML = '';

            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${NEIS_API_KEY}&Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=${currentEduCode}&SD_SCHUL_CODE=${currentSchoolCode}&MLSV_YMD=${mlsvYmd}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                loadingEl.classList.add('hidden');

                // 에러 처리 확인
                if (data.RESULT) {
                    const errCode = data.RESULT.CODE;
                    if (errCode === 'INFO-200') {
                        containerEl.innerHTML = `
                            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-center text-amber-800">
                                <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-amber-500"></i>
                                <h3 class="font-bold text-sm">해당 날짜에 등록된 급식 정보가 없습니다.</h3>
                                <p class="text-xs text-amber-600 mt-1">주말, 공휴일이거나 아직 식단이 등록되지 않은 날짜일 수 있습니다. 다른 날짜를 선택해 보세요.</p>
                            </div>
                        `;
                        return;
                    } else if (errCode === 'INFO-300' || errCode.startsWith('ERROR')) {
                        containerEl.innerHTML = `
                            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center text-rose-800">
                                <i class="fa-solid fa-circle-exclamation text-2xl mb-2 text-rose-500"></i>
                                <h3 class="font-bold text-sm">급식 정보를 불러오지 못했습니다.</h3>
                                <p class="text-xs text-rose-600 mt-1">[${errCode}] ${data.RESULT.MESSAGE}</p>
                            </div>
                        `;
                        return;
                    }
                }

                const mealRows = data.mealServiceDietInfo && data.mealServiceDietInfo[1] ? data.mealServiceDietInfo[1].row : [];
                
                // 중식(MMEAL_SC_CODE === '2') 필터링
                const lunchMeal = mealRows.find(item => item.MMEAL_SC_CODE === '2') || mealRows[0];

                if (!lunchMeal) {
                    containerEl.innerHTML = `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center text-slate-500">
                            <p class="text-sm font-medium">중식 식단 정보가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                // 메뉴 정제 (HTML 줄바꿈 및 알레르기 번호 정리)
                let rawMenu = lunchMeal.DDISH_NM || '';
                // <br/> 태그를 줄바꿈으로 변환 후 알레르기 숫자 및 특수문자 보기 좋게 파싱
                const menuLines = rawMenu.split('<br/>').map(item => item.trim());

                let menuHtml = '';
                menuLines.forEach(line => {
                    // 알레르기 정보 분리 (예: 닭갈비.2.5.6. -> 메뉴명과 번호 스타일링)
                    menuHtml += `
                        <div class="flex items-start gap-3 py-2 border-b border-slate-100 last:border-none">
                            <div class="w-2 h-2 rounded-full bg-blue-500 mt-2 shrink-0"></div>
                            <div class="text-sm font-medium text-slate-800">${line}</div>
                        </div>
                    `;
                });

                // 영양 정보 및 원산지 정보
                const cal = lunchMeal.CAL_INFO || '정보 없음';
                const ntr = lunchMeal.NTR_INFO || '정보 없음';
                const origin = lunchMeal.ORPLC_INFO || '정보 없음';

                containerEl.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                        <!-- 카드 헤더 -->
                        <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4 text-white flex items-center justify-between">
                            <div>
                                <div class="text-xs text-blue-100 font-medium">${currentSchoolName} (${currentRegionName})</div>
                                <h3 class="text-lg font-bold flex items-center gap-2 mt-0.5">
                                    <i class="fa-solid fa-utensils"></i> ${lunchMeal.MMEAL_SC_NM} (중식)
                                </h3>
                            </div>
                            <div class="text-right">
                                <span class="px-3 py-1 bg-white/10 backdrop-blur-xs rounded-xl text-xs font-semibold tracking-wide">
                                    ${lunchMeal.MLSV_YMD.replace(/(\d{4})(\d{2})(\d{2})/, '$1년 $2월 $3일')}
                                </span>
                            </div>
                        </div>

                        <!-- 본문 내용 -->
                        <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                            <!-- 메뉴 목록 (왼쪽 2칸 차지) -->
                            <div class="md:col-span-2 space-y-4">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">오늘의 메뉴 식단표</h4>
                                    <div class="bg-slate-50/70 rounded-xl p-4 border border-slate-100">
                                        ${menuHtml}
                                    </div>
                                    <p class="text-[11px] text-slate-400 mt-2">※ 메뉴 뒤의 숫자는 알레르기 정보 번호입니다. (1:난류, 2:우유, 3:메밀, 4:땅콩, 5:대두, 6:밀 등)</p>
                                </div>
                            </div>

                            <!-- 영양 및 원산지 정보 (오른쪽 1칸 차지) -->
                            <div class="space-y-4 flex flex-col justify-between">
                                <div class="space-y-4">
                                    <!-- 칼로리 -->
                                    <div class="bg-blue-50/50 border border-blue-100/80 rounded-xl p-4">
                                        <div class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                            <i class="fa-solid fa-fire"></i> 에너지 (칼로리)
                                        </div>
                                        <div class="text-base font-bold text-slate-800">${cal}</div>
                                    </div>

                                    <!-- 영양성분 -->
                                    <div class="bg-slate-50 border border-slate-200/60 rounded-xl p-4">
                                        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                                            <i class="fa-solid fa-chart-pie"></i> 영양 성분 정보
                                        </div>
                                        <div class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${ntr.replace(/<br\/>/g, '\n')}</div>
                                    </div>

                                    <!-- 원산지 정보 -->
                                    <div class="bg-slate-50 border border-slate-200/60 rounded-xl p-4">
                                        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                                            <i class="fa-solid fa-earth-asia"></i> 원산지 정보
                                        </div>
                                        <div class="text-xs text-slate-600 leading-relaxed">${origin}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error(err);
                loadingEl.classList.add('hidden');
                containerEl.innerHTML = `
                    <div class="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center text-rose-800">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-rose-500"></i>
                        <h3 class="font-bold text-sm">데이터를 불러오는 중 네트워크 오류가 발생했습니다.</h3>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
